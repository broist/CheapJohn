services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    env_file:
      - ./backend/.env
    ports:
      - "${APP_PORT}:8000"
    volumes:
      - ./backend:/app
      - /app/vendor

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "${FRONTEND_PORT}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  scraper:
    build: ./scraper
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SCRAPER_DB_DSN: ${SCRAPER_DB_DSN}
      LIDL_PLUS_EMAIL: ${LIDL_PLUS_EMAIL}
      LIDL_PLUS_PASSWORD: ${LIDL_PLUS_PASSWORD}
      SPAR_KLUB_EMAIL: ${SPAR_KLUB_EMAIL}
      SPAR_KLUB_PASSWORD: ${SPAR_KLUB_PASSWORD}
    volumes:
      - ./scraper/src:/app/src

volumes:
  db-data:
